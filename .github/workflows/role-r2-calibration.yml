name: ROLE R2 Calibration Report

on:
  workflow_dispatch:
    inputs:
      as_of_date:
        description: Optional causal cutoff date (YYYY-MM-DD)
        required: false
        type: string

concurrency:
  group: role-r2-calibration-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build read-only ROLE-R2 calibration report
        env:
          ROLE_AS_OF_DATE: ${{ inputs.as_of_date }}
        run: |
          EXTRA_ARGS=()
          if [[ -n "$ROLE_AS_OF_DATE" ]]; then EXTRA_ARGS+=(--as-of-date "$ROLE_AS_OF_DATE"); fi
          PYTHONPATH=. python scripts/report_role_r2.py --require-production-db "${EXTRA_ARGS[@]}"
