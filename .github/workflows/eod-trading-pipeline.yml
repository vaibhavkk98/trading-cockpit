name: EOD trading pipeline

on:
  schedule:
    # 16:07 Asia/Kolkata = 10:37 UTC, Monday through Friday. The completed-bar
    # gate in the runner is the authority for NSE holidays and delayed bars.
    - cron: "37 10 * * 1-5"
  workflow_dispatch:

concurrency:
  group: eod-trading-pipeline
  cancel-in-progress: false

jobs:
  run-eod:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run canonical EOD pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/run_eod_daily_pipeline.py
