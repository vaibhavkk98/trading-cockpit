name: Recommendation Ledger Backfill

on:
  workflow_dispatch:

concurrency:
  group: recommendation-ledger-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Backfill causally reconstructable recommendation states
        run: PYTHONPATH=. python scripts/backfill_recommendation_ledger.py --require-production-db
