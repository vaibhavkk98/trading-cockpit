name: Recommendation Ledger Backfill

on:
  workflow_dispatch:
    inputs:
      report_only:
        description: Read coverage without rewriting or replaying rows
        required: true
        default: false
        type: boolean

concurrency:
  group: recommendation-ledger-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Backfill causally reconstructable recommendation states
        run: |
          EXTRA_ARGS=()
          if [[ "${{ inputs.report_only }}" == "true" ]]; then EXTRA_ARGS+=(--report-only); fi
          PYTHONPATH=. python scripts/backfill_recommendation_ledger.py --require-production-db "${EXTRA_ARGS[@]}"
